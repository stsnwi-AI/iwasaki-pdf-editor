<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>かんたんPDF編集</title><link rel="stylesheet" href="style.css?v=5"><body><header><div class="brand">▧ <span>かんたんPDF編集<small>PDF WORKSPACE</small></span></div><label class="open">PDFを開く<input id="file" type="file" accept="application/pdf"></label><button id="save" class="primary" disabled>↓ 編集済みPDFを保存</button></header><main><aside><h2>書き込みツール</h2><div id="tools"><button data-tool="select" class="active">↖ 選択・移動</button><button data-tool="text">T 文字を追加</button><button data-tool="highlight">▰ マーカー</button><button data-tool="pen">✎ 手書き</button><button data-tool="rect">□ 四角</button><button data-tool="ellipse">○ 円</button><button data-tool="arrow">↗ 矢印</button><button data-tool="image">▧ 画像・図を挿入</button></div><input id="imageFile" type="file" accept="image/png,image/jpeg" hidden><h3>色を選ぶ</h3><div class="palette" role="group" aria-label="色パレット"><button class="swatch" data-color="#222222" title="黒" aria-label="黒" aria-pressed="false" style="--swatch:#222222"></button><button class="swatch" data-color="#808080" title="グレー" aria-label="グレー" aria-pressed="false" style="--swatch:#808080"></button><button class="swatch" data-color="#ffffff" title="白" aria-label="白" aria-pressed="false" style="--swatch:#ffffff"></button><button class="swatch" data-color="#e53935" title="赤" aria-label="赤" aria-pressed="false" style="--swatch:#e53935"></button><button class="swatch" data-color="#e59a19" title="オレンジ" aria-label="オレンジ" aria-pressed="false" style="--swatch:#e59a19"></button><button class="swatch" data-color="#ffe033" title="黄" aria-label="黄" aria-pressed="false" style="--swatch:#ffe033"></button><button class="swatch" data-color="#2e9e58" title="緑" aria-label="緑" aria-pressed="false" style="--swatch:#2e9e58"></button><button class="swatch" data-color="#2477df" title="青" aria-label="青" aria-pressed="false" style="--swatch:#2477df"></button><button class="swatch" data-color="#39c5e0" title="水色" aria-label="水色" aria-pressed="false" style="--swatch:#39c5e0"></button><button class="swatch" data-color="#8955cc" title="紫" aria-label="紫" aria-pressed="false" style="--swatch:#8955cc"></button><button class="swatch" data-color="#e95f9c" title="ピンク" aria-label="ピンク" aria-pressed="false" style="--swatch:#e95f9c"></button><button class="swatch" data-color="#805638" title="茶" aria-label="茶" aria-pressed="false" style="--swatch:#805638"></button></div><div class="settings"><select id="size" aria-label="追加する文字のサイズ"><option value="16">文字：小</option><option value="24" selected>文字：中</option><option value="36">文字：大</option><option value="48">文字：特大</option></select></div><textarea id="text" rows="3" placeholder="追加する文字を入力（日本語対応）"></textarea><section id="editor" hidden><b>選択した書き込みを修正</b><label id="editTextRow">文字内容<textarea id="editText" rows="3"></textarea></label><div id="editLineRow" class="line-presets"><span>線の太さ</span><button data-line="1">細い</button><button data-line="3">普通</button><button data-line="6">太い</button></div><button id="applyEdit" class="primary">文字を変更</button><p>角の白いつまみをドラッグしてサイズ変更。矢印は両端をドラッグ。文字はダブルクリックで内容を修正できます。</p></section><button id="undo">↶ 元に戻す</button><button id="delete">選択した書き込みを削除</button><div class="note"><b>ファイルは端末内で処理</b><p>PDFや画像をサーバーに送信しません。保存したPDFには書き込みが固定されます。</p></div></aside><section class="workspace"><div class="bar"><span id="filename">新しい作業を始めましょう</span><div><button id="prev">‹</button><span id="page">— / —</span><button id="next">›</button><select id="zoom" aria-label="表示倍率"><option value="0.7">70%</option><option value="1" selected>100%</option><option value="1.4">140%</option><option value="2">200%</option></select></div></div><div id="status" role="status">PDFを開くか、サンプルで試してください。</div><div id="empty"><div class="icon">▧</div><h1>PDFに、ひと手間を。</h1><p>文字・マーカー・図を追加して、そのまま保存。<br>ライセンス購入は不要です。</p><button id="sample" class="primary">サンプルPDFで試す</button><p class="hint">上の「PDFを開く」から、お手元の資料も使えます。</p></div><div id="paper"><canvas id="base"></canvas><canvas id="overlay"></canvas></div></section></main><script src="vendor/pdf.min.js"></script><script src="vendor/pdf-lib.min.js"></script><script src="vendor/cmaps.js"></script><script src="app.js?v=github2"></script></body></html>

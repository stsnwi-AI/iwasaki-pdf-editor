<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>かんたんPDF編集</title><link rel="stylesheet" href="style.css?v=4"><body><header><div class="brand">▧ <span>かんたんPDF編集<small>PDF WORKSPACE</small></span></div><label class="open">PDFを開く<input id="file" type="file" accept="application/pdf"></label><button id="save" class="primary" disabled>↓ 編集済みPDFを保存</button></header><main><aside><h2>書き込みツール</h2><div id="tools"><button data-tool="select" class="active">↖ 選択・移動</button><button data-tool="text">T 文字を追加</button><button data-tool="highlight">▰ マーカー</button><button data-tool="pen">✎ 手書き</button><button data-tool="rect">□ 四角</button><button data-tool="ellipse">○ 円</button><button data-tool="arrow">↗ 矢印</button><button data-tool="image">▧ 画像・図を挿入</button></div><input id="imageFile" type="file" accept="image/png,image/jpeg" hidden><h3>色・サイズ</h3><div class="settings"><input id="color" type="color" value="#e59a19" aria-label="色"><select id="size" aria-label="サイズ"><option value="16">小 / 16</option><option value="24" selected>中 / 24</option><option value="36">大 / 36</option><option value="48">特大 / 48</option></select></div><textarea id="text" rows="3" placeholder="追加する文字を入力（日本語対応）"></textarea><section id="editor" hidden><b>選択した書き込みを修正</b><label id="editTextRow">文字内容<textarea id="editText" rows="3"></textarea></label><div class="edit-grid"><label>色<input id="editColor" type="color"></label><label id="editFontRow">文字サイズ<input id="editFont" type="number" min="6" max="200"></label><label id="editLineRow">線の太さ<input id="editLine" type="number" min="1" max="30" step="0.5"></label><label>X位置<input id="editX" type="number" step="1"></label><label>Y位置<input id="editY" type="number" step="1"></label><label id="editWRow">幅<input id="editW" type="number" min="1" step="1"></label><label id="editHRow">高さ<input id="editH" type="number" min="1" step="1"></label></div><button id="applyEdit" class="primary">変更を反映</button><p>角の白いつまみをドラッグしてサイズ変更。矢印は両端をドラッグ。文字はダブルクリックで内容を修正できます。</p></section><button id="undo">↶ 元に戻す</button><button id="delete">選択した書き込みを削除</button><div class="note"><b>ファイルは端末内で処理</b><p>PDFや画像をサーバーに送信しません。保存したPDFには書き込みが固定されます。</p></div></aside><section class="workspace"><div class="bar"><span id="filename">新しい作業を始めましょう</span><div><button id="prev">‹</button><span id="page">— / —</span><button id="next">›</button><select id="zoom" aria-label="表示倍率"><option value="0.7">70%</option><option value="1" selected>100%</option><option value="1.4">140%</option><option value="2">200%</option></select></div></div><div id="status" role="status">PDFを開くか、サンプルで試してください。</div><div id="empty"><div class="icon">▧</div><h1>PDFに、ひと手間を。</h1><p>文字・マーカー・図を追加して、そのまま保存。<br>ライセンス購入は不要です。</p><button id="sample" class="primary">サンプルPDFで試す</button><p class="hint">上の「PDFを開く」から、お手元の資料も使えます。</p></div><div id="paper"><canvas id="base"></canvas><canvas id="overlay"></canvas></div></section></main><script src="vendor/pdf.min.js"></script><script src="vendor/pdf-lib.min.js"></script><script src="vendor/cmaps.js"></script><script src="app.js?v=github1"></script></body></html>
